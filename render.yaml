# Render Blueprint (free plan): one PostgreSQL database + one web service.
# The web service runs the HTTP API AND the email worker (RUN_WORKER_IN_API=true),
# because Render's free plan has no Background Workers.
#
# Render dashboard -> New -> Blueprint -> select this repository.
# Secrets marked `sync: false` are entered in the dashboard; they are never stored in git.
#
# To run the worker as its own service instead (paid "starter" plan), see the
# commented-out block at the end and set RUN_WORKER_IN_API to "false".

databases:
  - name: mailqueue-db
    databaseName: mailqueue
    user: mailqueue
    plan: free
    # Only Render services can connect (no access from the public internet).
    ipAllowList: []

services:
  - type: web
    name: mailqueue-api
    runtime: node
    plan: free
    # --include=dev: TypeScript is a devDependency and is needed to build.
    buildCommand: npm ci --include=dev && npm run build
    # Apply pending database migrations, then start the API (+ embedded worker).
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: mailqueue-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: RUN_WORKER_IN_API
        value: 'true'
      - key: EMAIL_MAX_RETRIES
        value: '3'
      - key: EMAIL_RETRY_DELAY_SECONDS
        value: '30'
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  # Optional separate worker (paid plan). Uncomment, and set RUN_WORKER_IN_API to 'false' above.
  # - type: worker
  #   name: mailqueue-worker
  #   runtime: node
  #   plan: starter
  #   buildCommand: npm ci --include=dev && npm run build
  #   startCommand: npm run start:worker
